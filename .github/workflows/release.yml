name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  # Prebuilt pacquet binary from pnpm/pnpm#12691 (Rust port of `publish`).
  # Pinned to commit c209946fea of the prebuilt-binaries repo for reproducibility.
  PACQUET_URL: https://raw.githubusercontent.com/KSXGitHub/pnpm-experimental-prebuilt-binaries/c209946fea/pr/12691-feat-pacquet-publish/pacquet-4f7c06da61-naive-sigstore-sign

jobs:
  release:
    permissions:
      id-token: write  # Required for OIDC
      contents: write  # for softprops/action-gh-release to create GitHub release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Download pacquet binary
        run: curl -fsSL -o ./pacquet "$PACQUET_URL"
      - name: Make pacquet binary executable
        run: chmod +x ./pacquet
      - name: Publish Packages
        run: ./pacquet publish --no-git-checks

